<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>取件直达 · 公告</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#15171b;--sub:#7b828d;--accent:#d9480f}
@media (prefers-color-scheme:dark){:root{--bg:#0e1013;--card:#171a20;--tx:#f3f5f8;--sub:#9aa3af}}
*{box-sizing:border-box}
body{margin:0;padding:24px 18px 60px;background:var(--bg);color:var(--tx);
 font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
h1{font-size:24px;margin:0 0 4px}
p.sub{color:var(--sub);font-size:13px;margin:0 0 20px}
.card{background:var(--card);border:1px solid rgba(128,128,128,.14);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 6px}
.card time{color:var(--sub);font-size:12px}
.card p{margin:8px 0 0;font-size:14px;white-space:pre-wrap}
a{color:var(--accent)}
</style>
</head>
<body>
<h1>取件直达</h1>
<p class="sub">校内一站式取件入口 · 公告与更新在这里发</p>
<div id="list"></div>
<script>
fetch('notice.json').then(r=>r.json()).then(d=>{
  const box=document.getElementById('list');
  (d.notices||[]).slice().reverse().forEach(n=>{
    const el=document.createElement('div'); el.className='card';
    el.innerHTML='<h2>'+n.title+'</h2><time>'+n.date+'</time><p>'+n.body+'</p>';
    box.appendChild(el);
  });
  if(d.version) {
    const el=document.createElement('div'); el.className='card';
    el.innerHTML='<h2>最新版本 '+d.version.name+'</h2><time>'+d.version.code+'</time><p>'+(d.version.notes||'')+'</p>';
    box.appendChild(el);
  }
}).catch(e=>{document.getElementById('list').textContent='读取失败：'+e});
</script>
</body>
</html>
